[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/englat-pdf", "apps/englat-pdf-cli", "xtask"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/zi007/englat-pdf"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { path = "vendor/craft-libs-5c874d5/crates/ui", version = "0.1.0", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { path = "vendor/craft-libs-f58bc1a/crates/quit", version = "0.1.0" }
# Shared system spooler; document composition remains in englat-pdf-print.
craft-print = { path = "vendor/craft-libs-666c358/crates/print", version = "0.1.0" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { path = "vendor/craft-libs-82a24b0/crates/docpath", version = "0.1.0" }
# internal
englat-pdf-geom = { path = "crates/geom", version = "0.8.0" }
englat-pdf-filters = { path = "crates/filters", version = "0.8.0" }
englat-pdf-cos = { path = "crates/cos", version = "0.8.0" }
englat-pdf-crypt = { path = "crates/crypt", version = "0.8.0" }
englat-pdf-organize = { path = "crates/organize", version = "0.8.0" }
englat-pdf-measure = { path = "crates/measure", version = "0.8.0" }
englat-pdf-annot = { path = "crates/annot", version = "0.8.0" }
englat-pdf-audit = { path = "crates/audit", version = "0.8.0" }
englat-pdf-fonts = { path = "crates/fonts", version = "0.8.0" }
englat-pdf-model = { path = "crates/model", version = "0.8.0" }
englat-pdf-content = { path = "crates/content", version = "0.8.0" }
englat-pdf-redact = { path = "crates/redact", version = "0.8.0" }
englat-pdf-print = { path = "crates/print", version = "0.8.0" }
englat-pdf-xfdf = { path = "crates/xfdf", version = "0.8.0" }
englat-pdf-sign = { path = "crates/sign", version = "0.8.0" }
englat-pdf-optimize = { path = "crates/optimize", version = "0.8.0" }
englat-pdf-a11y = { path = "crates/a11y", version = "0.8.0" }
englat-pdf-oracle = { path = "crates/oracle", version = "0.8.0" }
englat-pdf-testkit = { path = "crates/testkit", version = "0.8.0" }
englat-pdf-ocr = { path = "crates/ocr", version = "0.8.0" }
englat-pdf-js = { path = "crates/js", version = "0.8.0" }
englat-pdf-compare = { path = "crates/compare", version = "0.8.0" }
englat-pdf-preflight = { path = "crates/preflight", version = "0.8.0" }
englat-pdf-export = { path = "crates/export", version = "0.8.0" }
englat-pdf-edit = { path = "crates/edit", version = "0.8.0" }
englat-pdf-create = { path = "crates/create", version = "0.8.0" }
englat-pdf-forms = { path = "crates/forms", version = "0.8.0" }
englat-pdf-xfa = { path = "crates/xfa", version = "0.8.0" }
englat-pdf-render = { path = "crates/render", version = "0.8.0" }
englat-pdf-engine = { path = "crates/engine", version = "0.8.0" }
englat-pdf-platform = { path = "crates/platform", version = "0.8.0" }
englat-pdf-ui-egui = { path = "crates/ui-egui", version = "0.8.0" }
englat-pdf-automation = { path = "crates/automation", version = "0.8.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Our own crates
# keep full debug info. Dependencies keep only line tables, so backtraces still
# show file and line, but debug info for the whole dependency graph stays out of
# every test binary (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.dev]
opt-level = 1

[profile.low-disk]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
vello_common = { path = "vendor/vello_common" }
