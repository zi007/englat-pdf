[package]
name = "englat-pdf-cli"
description = "ENGLAT PDF command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "englat-pdf-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
englat-pdf-render = { workspace = true }
serde_json = { workspace = true }
englat-pdf-engine = { workspace = true }
englat-pdf-audit = { workspace = true }
englat-pdf-cos = { workspace = true }
englat-pdf-automation = { workspace = true }
englat-pdf-platform = { workspace = true }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for englat-pdf-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`englat-pdf-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["englat-pdf-automation/mcp"]
