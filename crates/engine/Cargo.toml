[package]
name = "englat-pdf-engine"
description = "ENGLAT PDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
englat-pdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
englat-pdf-render = { workspace = true }
englat-pdf-cos = { workspace = true }
englat-pdf-organize = { workspace = true }
englat-pdf-annot = { workspace = true }
englat-pdf-forms = { workspace = true }
englat-pdf-xfa = { workspace = true }
englat-pdf-edit = { workspace = true }
englat-pdf-audit = { workspace = true }
englat-pdf-redact = { workspace = true }
englat-pdf-print = { workspace = true }
englat-pdf-xfdf = { workspace = true }
englat-pdf-sign = { workspace = true }
englat-pdf-optimize = { workspace = true }
englat-pdf-a11y = { workspace = true }
englat-pdf-ocr = { workspace = true }
englat-pdf-js = { workspace = true }
englat-pdf-compare = { workspace = true }
englat-pdf-preflight = { workspace = true }
englat-pdf-export = { workspace = true }
englat-pdf-fonts = { workspace = true }
englat-pdf-create = { workspace = true }
englat-pdf-model = { workspace = true }
englat-pdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
